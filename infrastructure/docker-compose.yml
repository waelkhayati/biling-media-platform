services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biling_media}
      POSTGRES_USER: ${POSTGRES_USER:-biling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biling_dev}
    ports:
      - "5432:5432"
    volumes:
      - biling-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biling} -d ${POSTGRES_DB:-biling_media}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  biling-postgres-data:
